<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة حب خاصة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffb6c1, #8a2be2, #ff0000);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 3px solid #ff1493;
            z-index: 10;
        }

        .title {
            color: #8a2be2;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ff1493;
            margin-bottom: 20px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .rate-btn {
            background-color: #ff1493;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .rate-btn:hover {
            background-color: #8a2be2;
            transform: scale(1.05);
        }

        .feedback-msg {
            color: #ff0000;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .input-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-container label {
            color: #8a2be2;
            font-weight: bold;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .input-container input {
            padding: 12px;
            border: 2px solid #ff1493;
            border-radius: 8px;
            outline: none;
            text-align: center;
            font-size: 1rem;
        }

        .submit-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #8a2be2;
        }

        .hidden {
            display: none !important;
        }

        .animation-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 192, 203, 0.95);
            overflow: hidden;
        }

        .heart-nest {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-heart {
            position: absolute;
            font-size: 17px;
            opacity: 0;
            transform: scale(0);
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
            user-select: none;
        }

        .show-mini {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        .pulse-animation {
            animation: heartPulse 1.2s infinite alternate ease-in-out;
        }

        @keyframes heartPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .final-text {
            margin-top: 25px;
            color: #8a2be2;
            font-size: 2.3rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            z-index: 5;
        }

        .touch-heart {
            position: absolute;
            font-size: 24px;
            animation: touchPop 2s forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes touchPop {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -80px) scale(1.4);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -150px) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <h1 class="title">قيميني حبك ليا</h1>
        <p class="subtitle">اختاري رقم من 1 لـ 6</p>
        
        <div class="buttons-grid">
            <button class="rate-btn" onclick="handleRating(1)">1</button>
            <button class="rate-btn" onclick="handleRating(2)">2</button>
            <button class="rate-btn" onclick="handleRating(3)">3</button>
            <button class="rate-btn" onclick="handleRating(4)">4</button>
            <button class="rate-btn" onclick="handleRating(5)">5</button>
            <button class="rate-btn" onclick="handleRating(6)">6</button>
        </div>

        <div id="feedbackMessage" class="feedback-msg"></div>

        <div id="inputBox5" class="input-container hidden">
            <label for="reasonInput">إيه هي أجمل حاجة فيّا وعاجباكي ومخليكي حاطة الـ 5؟ ❤️</label>
            <input type="text" id="reasonInput" placeholder="اكتبي هنا...">
            <button class="submit-btn" onclick="startSurprise()">تأكيد ✨</button>
        </div>
    </div>

    <div id="animationScene" class="animation-scene hidden">
        <div class="heart-nest" id="heartContainer"></div>
        <h2 class="final-text">بحبك جداً ❤️</h2>
    </div>

    <!-- تشغيل ملف الأغنية المحلي song.mp3 -->
    <audio id="loveSong" src="song.mp3" preload="auto"></audio>

    <script>
        function handleRating(num) {
            const feedback = document.getElementById('feedbackMessage');
            const box5 = document.getElementById('inputBox5');

            box5.classList.add('hidden');
            feedback.innerText = "";

            if (num >= 1 && num <= 4) {
                feedback.innerText = "أكيد مش كدة.. اختاري الرقم الصحيح! 😉❤️";
            } else if (num === 5) {
                box5.classList.remove('hidden');
            } else if (num === 6) {
                startSurprise();
            }
        }

        function createHeartOutline(scale, colorClass, heartSymbol, count, delay) {
            const container = document.getElementById('heartContainer');
            const heartsGroup = [];
            
            for (let i = 0; i < count; i++) {
                let t = (i / count) * (2 * Math.PI);
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                let heart = document.createElement('span');
                heart.className = `mini-heart ${colorClass}`;
                heart.innerHTML = heartSymbol;
                
                heart.style.left = `calc(50% + ${x * scale}px)`;
                heart.style.top = `calc(50% + ${y * scale}px)`;

                container.appendChild(heart);
                heartsGroup.push(heart);

                setTimeout(() => {
                    heart.classList.add('show-mini');
                }, delay + (i * 20)); 
            }
            return heartsGroup;
        }

        function startSurprise() {
            document.getElementById('mainCard').classList.add('hidden');
            
            const scene = document.getElementById('animationScene');
            scene.classList.remove('hidden');

            const song = document.getElementById('loveSong');
            song.play().catch(error => {
                console.log("Audio autoplay blocked: ", error);
            });

            createHeartOutline(12.5, 'pink-heart', '🩷', 40, 300);
            createHeartOutline(8.5, 'purple-heart', '💜', 30, 1400);
            createHeartOutline(4.5, 'red-heart', '❤️', 20, 2400);

            setTimeout(() => {
                const nest = document.getElementById('heartContainer');
                nest.classList.add('pulse-animation');
            }, 3600);

            scene.addEventListener('pointerdown', (e) => {
                createTouchHeart(e.clientX, e.clientY, scene);
            });
        }

        function createTouchHeart(x, y, scene) {
            const touchHeart = document.createElement('span');
            touchHeart.className = 'touch-heart';
            const symbols = ['❤️', '🩷', '💜', '💖', '💓'];
            touchHeart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            
            touchHeart.style.left = `${x}px`;
            touchHeart.style.top = `${y}px`;

            scene.appendChild(touchHeart);

            setTimeout(() => {
                touchHeart.remove();
            }, 2000);
        }
    </script>
</body>
</html>
